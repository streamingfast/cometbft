name: Lint
# Runs golangci-lint on pull requests and reports only issues introduced since
# the merge base with the PR's base branch. Pre-existing findings in fork code
# don't fail unrelated changes.
#
# To run this locally, run `make lint` from the root of the repo.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # golangci-lint needs history to find the merge base.
          fetch-depth: 0

      - run: echo "GO_VERSION=$(cat .github/workflows/go-version.env | grep GO_VERSION | cut -d '=' -f2)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --timeout=15m --new-from-merge-base=origin/${{ github.base_ref }}
          skip-cache: true
