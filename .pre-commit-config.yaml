---
# Details: https://pre-commit.com/#new-hooks

repos:
  # golangci-lint
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-full
        # Only report issues introduced since the merge base with v1.x-inj, so
        # pre-existing findings in fork code don't block unrelated changes.
        # This includes the formatters (gofumpt, gci, goimports, gofmt)
        # configured in .golangci.yml.
        args: [--timeout, 10m, --new-from-merge-base=origin/v1.x-inj] # for CI

  # codespell
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [-w]
